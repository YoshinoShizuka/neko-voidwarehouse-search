# ===== 全版本共享 =====
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 与 carpet-Neko-Addition 相同的多版本结构：
#   modern/<mc>/   26.x（不混淆，net.fabricmc.fabric-loom，Java 25）
#   versions/<mc>/ 1.21.x（混淆，net.fabricmc.fabric-loom-remap + Mojang 官方映射，Java 21）
# 共享纯逻辑（SearchIndex，不引用 MC 类型）在 common/，各版本 jar 合并其产物。

# 版本之间真的变了的只有两处（均已 javap 实证，2026-11-01）：
#   ① 网络注册表名：26.x = serverboundPlay()/clientboundPlay()；1.21.11 = playC2S()/playS2C()
#   ② 渲染钩子：两代容器屏都不调 super（render / extractRenderState 都不渲染 renderables），
#      但方法签名不同 —— 26.x 是 extractRenderState(GuiGraphicsExtractor,...)，1.21.11 是
#      render(GuiGraphics,...)。Mixin 的渲染注入按版本各写一份。

mod_version=0.1.1
maven_group=neko
archives_base_name=neko-voidwarehouse-search

loom_version=1.18.2
loader_version=0.19.5

# 拼音匹配：jpinyin（Apache-2.0，Maven Central；TinyPinyin 在 Central 无坐标实测 404）
jpinyin_version=1.1.8
